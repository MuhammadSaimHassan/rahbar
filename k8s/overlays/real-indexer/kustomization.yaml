# The API still uses stubs until the query-pipeline milestone.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - writer-egress.yaml
images:
  - name: rahbar-indexer
    newTag: corpus-dev
patches:
  - target:
      kind: ConfigMap
      name: rahbar-config
    patch: |-
      - op: replace
        path: /data/EMBED_MODEL
        value: nomic-embed-text
  - target:
      kind: Job
      name: indexer
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: []
      - op: replace
        path: /spec/activeDeadlineSeconds
        value: 7200
  - target:
      kind: CronJob
      name: reindex
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/args
        value: []
      - op: replace
        path: /spec/jobTemplate/spec/activeDeadlineSeconds
        value: 7200
