name: Real corpus acceptance

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-corpus:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && (contains(github.event.pull_request.labels.*.name, 'run-real-corpus') || contains(github.event.pull_request.labels.*.name, 'run-real-evaluation')))
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned project dependencies
        run: python -m pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - name: Fresh real corpus on minikube and host Ollama
        env:
          REAL_EVALUATION: ${{ contains(github.event.pull_request.labels.*.name, 'run-real-evaluation') }}
          REPORT_DIR: ${{ runner.temp }}/rahbar-real-reports
        run: bash scripts/real-corpus-acceptance.sh
      - name: Preserve real results and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-corpus-acceptance
          path: ${{ runner.temp }}/rahbar-real-reports
          if-no-files-found: warn
          retention-days: 7
