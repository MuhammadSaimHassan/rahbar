apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
data:
  RETRIEVER: stub
  LLM_PROVIDER: stub
  EMBED_MODEL: dummy-768
  EMBED_DIMENSION: "768"
  EMBED_BATCH_SIZE: "16"
  EMBED_TIMEOUT: "120"
  STORE_BATCH_SIZE: "128"
  OCR_ENABLED: "true"
  OCR_CACHE_DIR: /tmp/rahbar-ocr
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: rahbar
  REDIS_URL: redis://redis:6379/0
  DEPENDENCY_TIMEOUT: "2"
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
  TOP_K: "5"
  # Thresholds measured on the Phase 5 golden set and labeled cache pairs.
  RELEVANCE_FLOOR: "0.70"
  CACHE_THRESHOLD: "0.85"
  # Low temperature reduces variation in factual answers and structured output.
  TEMPERATURE: "0.2"
  GENERATION_TIMEOUT: "90"
  LLM_MODEL: llama3.2:3b
  HOSTED_BASE_URL: ""
  OLLAMA_URL: http://host.minikube.internal:11434
  CORPUS_DIR: /corpus
  LOG_LEVEL: INFO
  ANONYMIZED_TELEMETRY: "False"
