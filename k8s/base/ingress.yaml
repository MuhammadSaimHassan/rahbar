apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rahbar
spec:
  ingressClassName: nginx
  rules:
    - host: rahbar.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port: {name: http}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port: {name: http}
