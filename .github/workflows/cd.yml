name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rahbar-cd-main
  cancel-in-progress: false

env:
  API_IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/rahbar-api:${{ github.sha }}
  UI_IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/rahbar-ui:${{ github.sha }}
  INDEXER_IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/rahbar-indexer:${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - run: bash scripts/ci-checks.sh lint
      - run: bash scripts/ci-checks.sh test

  build-push:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and scan commit images
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          : "${DOCKERHUB_NAMESPACE:?Set the DOCKERHUB_NAMESPACE repository variable}"
          docker build --pull --provenance=false -t "$API_IMAGE" api
          docker build --pull --provenance=false -t "$UI_IMAGE" ui
          docker build --pull --provenance=false -t "$INDEXER_IMAGE" indexer
          bash scripts/ci-scan.sh "$API_IMAGE" "$UI_IMAGE" "$INDEXER_IMAGE"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the tested commit
        run: |
          docker push "$API_IMAGE"
          docker push "$UI_IMAGE"
          docker push "$INDEXER_IMAGE"

  deploy:
    needs: build-push
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPORT_DIR: ${{ github.workspace }}/ci-reports
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull the published commit images
        run: |
          docker pull "$API_IMAGE"
          docker pull "$UI_IMAGE"
          docker pull "$INDEXER_IMAGE"
      - run: python -m pip install -r api/requirements.txt PyYAML==6.0.2
      - run: bash scripts/ci-install-k3d.sh
      - name: Deploy and smoke-test through Ingress
        run: bash scripts/ci-cluster.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-smoke
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 7
