apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:7.4.2-bookworm
          imagePullPolicy: IfNotPresent
          command: [redis-server]
          # Keep the permanent active-index catalog and writer lock under memory pressure.
          args: [--appendonly, "yes", --dir, /data, --maxmemory, 96mb, --maxmemory-policy, noeviction]
          ports:
            - {name: redis, containerPort: 6379}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 20
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: redis-data}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
