apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fixture-egress
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [api, indexer]}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: fixture-model}
      ports:
        - {protocol: TCP, port: 11434}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fixture-model-ingress
spec:
  podSelector:
    matchLabels: {app: fixture-model}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [api, indexer]}
      ports:
        - {protocol: TCP, port: 11434}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fixture-indexer-redis
spec:
  podSelector:
    matchLabels: {app: indexer}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: redis}
      ports:
        - {protocol: TCP, port: 6379}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fixture-redis-ingress
spec:
  podSelector:
    matchLabels: {app: redis}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: indexer}
      ports:
        - {protocol: TCP, port: 6379}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fixture-traefik-ingress
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [api, ui]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports:
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 8080}
