apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
resources:
  - ../prod
  - ../../../eval/fixtures
  - model.yaml
  - networkpolicy.yaml
patches:
  - target: {kind: Ingress, name: rahbar}
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: traefik
  - target: {kind: ConfigMap, name: rahbar-config}
    patch: |-
      - op: replace
        path: /data/RETRIEVER
        value: chroma
      - op: replace
        path: /data/LLM_PROVIDER
        value: ollama-incluster
      - op: replace
        path: /data/LLM_MODEL
        value: fixture-chat
      - op: replace
        path: /data/EMBED_MODEL
        value: fixture-embed
      - op: replace
        path: /data/OLLAMA_URL
        value: http://fixture-model:11434
      - op: replace
        path: /data/RELEVANCE_FLOOR
        value: "1.01"
      - op: replace
        path: /data/OCR_ENABLED
        value: "false"
  - target: {kind: CronJob, name: reindex}
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
  - path: indexer.yaml
