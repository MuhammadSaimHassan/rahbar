apiVersion: batch/v1
kind: Job
metadata:
  name: indexer
spec:
  template:
    spec:
      containers:
        - name: indexer
          args: []
          volumeMounts:
            - name: fixture-corpus
              mountPath: /corpus
              readOnly: true
      volumes:
        - name: fixture-corpus
          configMap:
            name: fixture-corpus
