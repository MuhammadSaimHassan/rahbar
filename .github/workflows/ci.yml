name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: read

env:
  API_IMAGE: rahbar-api:${{ github.sha }}
  UI_IMAGE: rahbar-ui:${{ github.sha }}
  INDEXER_IMAGE: rahbar-indexer:${{ github.sha }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - run: bash scripts/ci-checks.sh lint
      - run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.11

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - run: bash scripts/ci-checks.sh test

  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate production and fixture manifests
        shell: bash
        run: |
          for overlay in prod ci; do
            kubectl kustomize "k8s/overlays/$overlay" |
              docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -kubernetes-version 1.35.5
          done

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the three images
        run: |
          docker build --pull --provenance=false -t "$API_IMAGE" api
          docker build --pull --provenance=false -t "$UI_IMAGE" ui
          docker build --pull --provenance=false -t "$INDEXER_IMAGE" indexer
          docker save "$API_IMAGE" "$UI_IMAGE" "$INDEXER_IMAGE" | gzip -1 > images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ci-images
          path: images.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  scan:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ci-images
      - run: docker load --input images.tar.gz
      - run: bash scripts/ci-scan.sh "$API_IMAGE" "$UI_IMAGE" "$INDEXER_IMAGE"

  e2e-eval:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPORT_DIR: ${{ github.workspace }}/ci-reports
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ci-images
      - run: docker load --input images.tar.gz
      - run: python -m pip install -r api/requirements.txt PyYAML==6.0.2
      - run: bash scripts/ci-install-k3d.sh
      - run: bash scripts/ci-cluster.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-evaluation
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 7
